<html lang="en-GB">

<meta charset="utf-8">

<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --bg: #ece8f2;
    --ink: #231e30;
    --ink-soft: #5d566d;
    --sage: #cfdacb;
    --sand: #ead9c2;
    --amber: #ecc67f;
    --rose: #e6c4cd;
    --mist: #c9d7e6;
    --line: rgba(35, 30, 48, .14);
    --row: rgba(255, 255, 255, .6);
    --row-hover: #fff;
    --glow-1: rgba(207, 218, 203, .65);
    --glow-2: rgba(236, 198, 127, .38);
    --glow-3: rgba(230, 196, 205, .55);
    --shadow: rgba(35, 30, 48, .45);
    --accent: #ecc67f;
    --on-accent: #231e30;
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
    --bg: #15121b;
    --ink: #eee9f5;
    --ink-soft: #a59eb4;
    --sage: #26302a;
    --sand: #322a22;
    --amber: #3b301d;
    --rose: #36262d;
    --mist: #222c38;
    --line: rgba(238, 233, 245, .16);
    --row: rgba(255, 255, 255, .06);
    --row-hover: rgba(255, 255, 255, .12);
    --glow-1: rgba(70, 96, 76, .35);
    --glow-2: rgba(150, 110, 40, .22);
    --glow-3: rgba(120, 70, 90, .30);
    --shadow: rgba(0, 0, 0, .6);
    --accent: #ecc67f;
    color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15121b;
    --ink: #eee9f5;
    --ink-soft: #a59eb4;
    --sage: #26302a;
    --sand: #322a22;
    --amber: #3b301d;
    --rose: #36262d;
    --mist: #222c38;
    --line: rgba(238, 233, 245, .16);
    --row: rgba(255, 255, 255, .06);
    --row-hover: rgba(255, 255, 255, .12);
    --glow-1: rgba(70, 96, 76, .35);
    --glow-2: rgba(150, 110, 40, .22);
    --glow-3: rgba(120, 70, 90, .30);
    --shadow: rgba(0, 0, 0, .6);
    --accent: #ecc67f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.45;
    padding: max(32px, env(safe-area-inset-top)) 18px max(32px, env(safe-area-inset-bottom));
  }
  main { max-width: 440px; margin: 0 auto; }

  /* Profile */
  header { text-align: center; padding: 8px 0 22px; }
  .avatar {
    width: 112px; height: 112px; border-radius: 50%;
    margin: 0 auto 14px;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center;
    font-size: 44px; font-weight: 800;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .handle { margin: 2px 0 0; color: var(--ink-soft); font-size: 15px; }
  .bio { margin: 12px auto 0; max-width: 32ch; font-size: 16px; }

  /* Socials */
  .socials { display: flex; justify-content: center; gap: 12px; margin: 20px 0 0; padding: 0; list-style: none; }
  .socials a {
    width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center;
    border: 1.5px solid var(--ink); color: var(--ink);
    text-decoration: none;
    transition: background .15s, color .15s;
  }
  .socials a:hover { background: var(--ink); color: var(--bg); }
  .socials svg { width: 22px; height: 22px; display: block; }

  /* Brands & collabs button */
  .collab {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 18px 0 0; padding: 14px 18px 14px 22px;
    background: var(--ink); color: var(--bg);
    border-radius: 22px; text-decoration: none; text-align: left;
    transition: transform .15s;
  }
  .collab:hover { transform: translateY(-1px); }
  .collab:active { transform: scale(.99); }
  .collab-text { display: grid; }
  .collab-kicker { font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
  .collab-title { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  .collab svg { flex: none; width: 36px; height: 36px; padding: 8px; border-radius: 50%; background: var(--accent); color: var(--on-accent); }
  @media (prefers-reduced-motion: reduce) { .collab { transition: none; } }

  /* Categories */
  .cats { display: grid; gap: 12px; margin-top: 6px; }
  details { border-radius: 22px; background: var(--tint); }
  details summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 20px 22px;
    border-radius: 22px;
  }
  details summary::-webkit-details-marker { display: none; }
  .cat-title { font-size: 21px; font-weight: 800; letter-spacing: -.01em; display: block; }
  .cat-blurb { font-size: 14px; color: var(--ink-soft); display: block; margin-top: 1px; }
  .chev { flex: none; width: 22px; height: 22px; transition: transform .2s; }
  details[open] .chev { transform: rotate(180deg); }
  details[open] summary { padding-bottom: 12px; }

  .items { list-style: none; margin: 0; padding: 0 12px 12px; display: grid; gap: 6px; }
  .items a {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 13px 14px;
    background: var(--row);
    border-radius: 14px;
    color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15.5px;
  }
  .items a:hover { background: var(--row-hover); }
  .items .row { display: block; }
  .items .row-title { display: block; }
  .items .row-note { display: block; margin-top: 2px; font-weight: 400; font-size: 13.5px; color: var(--ink-soft); }
  .items .static { padding: 13px 14px; border-radius: 14px; border: 1.5px dashed var(--line); font-weight: 600; font-size: 15.5px; }
  .items a.video-link { margin-top: 0; justify-content: center; background: transparent; border: 1.5px solid var(--ink); font-size: 14px; padding: 10px 14px; }
  .items .row + a.video-link { margin-top: 6px; }
  .items a.video-link:hover { background: var(--ink); color: var(--bg); }
  .price { flex: none; font-weight: 400; color: var(--ink-soft); font-size: 14px; }
  .empty { padding: 0 22px 18px; margin: 0; color: var(--ink-soft); font-size: 14px; }

  a:focus-visible, summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* Theme toggle */
  .theme-toggle {
    position: fixed; z-index: 5;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: calc(max(14px, env(safe-area-inset-right, 0px)));
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: var(--bg); color: var(--ink);
    border: 1.5px solid var(--line);
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  .theme-toggle:hover { border-color: var(--ink); }
  .theme-toggle:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .theme-toggle svg { width: 20px; height: 20px; display: block; }
  .theme-toggle .sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .sun { display: block; }
  :root[data-theme="dark"] .theme-toggle .moon { display: none; }

  footer { margin-top: 28px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }
  footer p { margin: 0 auto; max-width: 34ch; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---------- Motion ---------- */
  html { scroll-behavior: smooth; }
  main { position: relative; z-index: 1; }

  /* slow ambient colour drift behind everything */
  body::before {
    content: ""; position: fixed; inset: -20%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(40% 35% at 18% 18%, var(--glow-1), transparent 70%),
      radial-gradient(35% 30% at 86% 30%, var(--glow-2), transparent 70%),
      radial-gradient(42% 36% at 60% 92%, var(--glow-3), transparent 70%);
    animation: drift 30s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes drift { to { transform: translate3d(4%, 3%, 0) scale(1.08); } }

  /* staged entrance */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pop  { from { opacity: 0; transform: scale(.88); }      to { opacity: 1; transform: none; } }
  .reveal     { animation: rise .85s cubic-bezier(.22, 1, .36, 1) backwards; animation-delay: calc(var(--i, 0) * 75ms + 60ms); }
  .reveal-pop { animation-name: pop; animation-duration: .9s; }

  /* cards */
  details { overflow: hidden; transition: transform .35s cubic-bezier(.22, 1, .36, 1), box-shadow .35s ease; }
  details[open] summary { padding-bottom: 20px; }
  .items { margin-top: -8px; }
  .chev { transition: transform .45s cubic-bezier(.22, 1, .36, 1); }
  details:has(summary:active):not([open]) { transform: scale(.992); }
  @media (hover: hover) {
    details:not([open]):hover { transform: translateY(-2px); box-shadow: 0 10px 24px -14px var(--shadow); }
  }

  /* socials + rows */
  .socials a { transition: background .25s ease, color .25s ease, transform .35s cubic-bezier(.22, 1, .36, 1); }
  .socials a:active { transform: scale(.93); }
  .items a { transition: background .25s ease, color .25s ease, transform .3s cubic-bezier(.22, 1, .36, 1); }
  .items a:active { transform: scale(.985); }
  @media (hover: hover) {
    .socials a:hover { transform: translateY(-3px); }
    .items a:not(.video-link):hover { transform: translateX(3px); }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    body::before { animation: none; }
    .reveal, .reveal-pop { animation: none; }
    details, .chev, .socials a, .items a { transition: none !important; }
  }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>

</button>

  <section class="cats" id="cats" aria-label="Shop by category"></section>

</main>

function tagged(url) {
  try {
    const u = new URL(url);
    if (/(^|\.)amazon\./i.test(u.hostname)) u.searchParams.set("tag", AMAZON_TAG);
    return u.toString();
  } catch (e) { return url; }
}

// Categories
const catsEl = document.getElementById("cats");
const chevron = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

CATEGORIES.forEach((cat, idx) => {
  const d = document.createElement("details");
  d.classList.add("reveal");
  d.style.setProperty("--i", 5 + idx);
  d.style.setProperty("--tint", cat.tint);

  const s = document.createElement("summary");
  const text = document.createElement("span");
  const t = document.createElement("span"); t.className = "cat-title"; t.textContent = cat.title;
  const b = document.createElement("span"); b.className = "cat-blurb"; b.textContent = cat.blurb;
  text.append(t, b);
  s.appendChild(text);
  s.insertAdjacentHTML("beforeend", chevron);
  d.appendChild(s);

  if (cat.items.length) {
    const ul = document.createElement("ul");
    ul.className = "items";
    if (cat.video) {
      const li = document.createElement("li");
      const v = document.createElement("a");
      v.className = "video-link";
      v.href = cat.video;
      v.target = "_blank";
      v.rel = "noopener";
      v.textContent = "Watch the video on TikTok";
      li.appendChild(v);
      ul.appendChild(li);
    }
    cat.items.forEach(item => {
      const li = document.createElement("li");
      const inner = document.createElement("span");
      inner.className = "row";
      const label = document.createElement("span"); label.className = "row-title"; label.textContent = item.title;
      inner.appendChild(label);
      if (item.note) {
        const n = document.createElement("span"); n.className = "row-note"; n.textContent = item.note;
        inner.appendChild(n);
      }
      if (item.url) {
        const a = document.createElement("a");
        a.href = tagged(item.url);
        a.target = "_blank";
        a.rel = /(^|\.)amazon\./i.test(a.hostname) || /^(link\.amazon|amzn\.)/i.test(a.hostname) ? "noopener sponsored" : "noopener";
        a.appendChild(inner);
        if (item.price) {
          const p = document.createElement("span"); p.className = "price"; p.textContent = item.price;
          a.appendChild(p);
        }
        li.appendChild(a);
      } else {
        const box = document.createElement("div");
        box.className = "static";
        box.appendChild(inner);
        li.appendChild(box);
      }
      if (item.video) {
        const v = document.createElement("a");
        v.className = "video-link";
        v.href = item.video;
        v.target = "_blank";
        v.rel = "noopener";
        v.textContent = "Watch the video on TikTok";
        li.appendChild(v);
      }
      ul.appendChild(li);
    });
    d.appendChild(ul);
  } else {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Coming soon.";
    d.appendChild(p);
  }
  catsEl.appendChild(d);
});

// ---------- Motion ----------
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const EASE = "cubic-bezier(0.22, 1, 0.36, 1)";

// header entrance
["avatar", "name", "handle", "bio", "socials"].forEach((id, i) => {
  const el = document.getElementById(id);
  el.classList.add(id === "avatar" ? "reveal-pop" : "reveal", "reveal");
  el.style.setProperty("--i", i);
});

// smooth open / close for each category
document.querySelectorAll("details").forEach(d => {
  const summary = d.querySelector("summary");
  let anim = null;
  let target = d.open;

  summary.addEventListener("click", e => {
    if (reduceMotion.matches) return; // fall back to the native instant toggle
    e.preventDefault();
    target = !target;

    const from = d.offsetHeight;      // current height, even mid-animation
    if (anim) anim.cancel();
    if (target) d.open = true;
    const to = target ? d.offsetHeight : summary.offsetHeight;

    anim = d.animate(
      { height: [from + "px", to + "px"] },
      { duration: 460, easing: EASE }
    );
    const mine = anim;
    mine.onfinish = () => {
      if (anim === mine) { if (!target) d.open = false; anim = null; }
    };

    if (target) {
      d.querySelectorAll(".items > li, .empty").forEach((el, i) => {
        el.animate(
          { opacity: [0, 1], transform: ["translateY(10px)", "translateY(0)"] },
          { duration: 480, delay: 70 + Math.min(i, 10) * 35, easing: EASE, fill: "backwards" }
        );
      });
    }
  });
});

/* Theme toggle */
const themeBtn = document.getElementById("themeToggle");
function syncThemeLabel() {
  const dark = document.documentElement.dataset.theme === "dark";
  themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
}
syncThemeLabel();
themeBtn.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
  syncThemeLabel();
});
</script>
</body>
</html>
